<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Stream AI</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge.live {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }
    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .now-playing-content {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .track-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .track-artist {
      font-size: 1rem;
      color: var(--subtext);
    }
    .host-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 4px;
      padding: 4px 8px;
      background: var(--accent-glow);
      border-radius: 6px;
      width: fit-content;
    }
    .shoutout-box {
      margin-top: 12px;
      padding: 12px;
      border-left: 3px solid var(--accent);
      background: rgba(56, 189, 248, 0.05);
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: #cbd5e1;
      font-style: italic;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
    button.btn-play {
      flex: 1;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.btn-play:hover { opacity: 0.9; }
    .queue-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .queue-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
    }
    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .queue-item .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .queue-item .by {
      font-size: 0.75rem;
      color: var(--subtext);
    }
    form.request-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 0.85rem; color: var(--subtext); }
    input, textarea {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    button.btn-submit {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-submit:hover { opacity: 0.9; }
    .alert {
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
    .alert.success { background: rgba(34, 197, 94, 0.2); color: var(--success); display: block; }
    .alert.error { background: rgba(239, 68, 68, 0.2); color: var(--danger); display: block; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Now Playing Card -->
    <div class="card">
      <div class="header">
        <h2>Radio Stream AI</h2>
        <div id="liveBadge" class="badge live">
          <span class="dot"></span>
          <span>ON AIR</span>
        </div>
      </div>

      <div class="now-playing-content">
        <div id="trackTitle" class="track-title">Menunggu siaran dimulai...</div>
        <div id="trackArtist" class="track-artist">Live Radio Stream</div>
        <div id="hostStatus" class="host-status" style="display:none;">🎙️ Host sedang mengudara...</div>
        <div id="shoutoutBox" class="shoutout-box" style="display:none;"></div>
      </div>

      <div class="controls">
        <audio id="audioElement" preload="none"></audio>
        <button id="playBtn" class="btn-play">▶ Putar Radio</button>
      </div>
    </div>

    <!-- Antrian Card -->
    <div class="card">
      <div class="queue-title">Antrian Berikutnya</div>
      <ul id="queueList" class="queue-list">
        <li style="color:var(--subtext);font-size:0.85rem;">Belum ada lagu dalam antrian.</li>
      </ul>
    </div>

    <!-- Request & Titip Salam Card -->
    <div class="card">
      <div class="queue-title">Request Lagu & Titip Salam</div>
      <form id="requestForm" class="request-form">
        <div class="form-group">
          <label>Nama Kamu</label>
          <input type="text" id="reqName" placeholder="Contoh: Roy" required maxlength="50">
        </div>
        <div class="form-group">
          <label>Judul Lagu atau Link YouTube</label>
          <input type="text" id="reqSong" placeholder="Contoh: Sheila on 7 Dan atau link https://..." required>
        </div>
        <div class="form-group">
          <label>Pesan Titip Salam (Opsional)</label>
          <textarea id="reqShoutout" rows="2" placeholder="Salam buat temen-temen kantor..." maxlength="200"></textarea>
        </div>
        <button type="submit" class="btn-submit">Kirim Request</button>
        <div id="formAlert" class="alert"></div>
      </form>
    </div>
  </div>

  <script>
    const audio = document.getElementById("audioElement");
    const playBtn = document.getElementById("playBtn");
    const hlsSrc = "/hls/live.m3u8";
    let hls = null;
    let isPlaying = false;

    // HLS Initializer
    function setupHls() {
      if (Hls.isSupported()) {
        hls = new Hls({
          liveSyncDurationCount: 3,
          maxLiveSyncPlaybackRate: 1.5,
        });
        hls.loadSource(hlsSrc);
        hls.attachMedia(audio);
      } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.src = hlsSrc;
      }
    }

    playBtn.addEventListener("click", () => {
      if (!isPlaying) {
        if (!hls && Hls.isSupported()) setupHls();
        audio.play().then(() => {
          isPlaying = true;
          playBtn.textContent = "⏸ Jeda Radio";
        }).catch(err => {
          console.error("Playback error:", err);
        });
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = "▶ Putar Radio";
      }
    });

    // Poll State
    async function updateState() {
      try {
        const res = await fetch("/api/now-playing");
        if (!res.ok) return;
        const data = await res.json();
        
        document.getElementById("trackTitle").textContent = data.title || "Siaran Radio";
        document.getElementById("trackArtist").textContent = data.artist || "Live Stream";
        
        const hostEl = document.getElementById("hostStatus");
        hostEl.style.display = data.is_host_speaking ? "inline-flex" : "none";

        const shoutBox = document.getElementById("shoutoutBox");
        if (data.shoutout) {
          shoutBox.textContent = `"${data.shoutout}"`;
          shoutBox.style.display = "block";
        } else {
          shoutBox.style.display = "none";
        }
      } catch (e) {
        console.warn("Poll state error:", e);
      }
    }

    // Poll Queue
    async function updateQueue() {
      try {
        const res = await fetch("/api/queue");
        if (!res.ok) return;
        const items = await res.json();
        const list = document.getElementById("queueList");
        if (!items || items.length === 0) {
          list.innerHTML = '<li style="color:var(--subtext);font-size:0.85rem;">Belum ada lagu dalam antrian.</li>';
          return;
        }
        list.innerHTML = items.map((it, idx) => `
          <li class="queue-item">
            <div class="info">
              <strong>${idx + 1}. ${it.title}</strong>
              <span class="by">oleh ${it.artist} (req: ${it.requested_by})</span>
            </div>
          </li>
        `).join("");
      } catch (e) {}
    }

    // Form Submit
    const form = document.getElementById("requestForm");
    const alertBox = document.getElementById("formAlert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.className = "alert";
      alertBox.style.display = "none";

      const payload = {
        name: document.getElementById("reqName").value.trim(),
        query: document.getElementById("reqSong").value.trim(),
        shoutout: document.getElementById("reqShoutout").value.trim(),
      };

      try {
        const res = await fetch("/api/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const result = await res.json();
        if (res.ok && result.ok) {
          alertBox.textContent = `Request diterima! Lagu ada di posisi #${result.position}.`;
          alertBox.className = "alert success";
          document.getElementById("reqSong").value = "";
          document.getElementById("reqShoutout").value = "";
          updateQueue();
        } else {
          alertBox.textContent = result.error || "Gagal mengirim request.";
          alertBox.className = "alert error";
        }
      } catch (err) {
        alertBox.textContent = "Koneksi ke server gagal.";
        alertBox.className = "alert error";
      }
    });

    setInterval(updateState, 3000);
    setInterval(updateQueue, 5000);
    updateState();
    updateQueue();
  </script>
</body>
</html>
