services:
  bot:
    build: .
    container_name: spotify-tg-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      # hanya expose ke LAN/WSL, dipakai untuk healthcheck & login OAuth sekali.
      - "8888:8888"   # OAuth callback (bisa dimatikan setelah login)
      - "8080:8080"   # /healthz untuk watchdog host (nanti)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
