services:
  radio:
    build: .
    container_name: radio-stream-ai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./bin:/app/bin
    ports:
      - "8000:8000"   # Web Player (HLS) & REST API
      - "8080:8080"   # /healthz endpoint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
